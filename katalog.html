<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog — Hildings Hantverk</title>
  <meta name="description" content="Handgjorda ljus från Hildings Hantverk — sexa sax, kronor, spiror, sockertoppar och snöbollar." />
  <link rel="icon" href="logos/variations/badge-round-green.svg" type="image/svg+xml" />
  <link rel="icon" href="logos/variations/logo-only.svg" sizes="any" />
  <link rel="apple-touch-icon" href="logos/variations/app-icon-dark.svg" />
  <meta name="theme-color" content="#14100c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand-mark" href="index.html"><span class="brand-mark__logo" aria-hidden="true"></span> Hildings Hantverk</a>
      <button class="nav-toggle" aria-label="Meny" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="nav" id="site-nav">
        <a href="index.html">Hem</a>
        <a href="katalog.html" aria-current="page">Katalog</a>
        <a href="bilder.html">Bilder</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="wrap">
      <p class="eyebrow">Vårt sortiment</p>
      <h1>Katalog</h1>
      <p class="lead">Handdoppade ljus i klassiska former. Varje ljus är gjort för hand — små skillnader hör till charmen.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="grid" id="product-grid">
        <!-- cards injected below -->
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <p class="muted" style="margin:0">© 2025 Hildings Hantverk</p>
      <div class="footer-contact">
        <a href="mailto:hildingshantverk@gmail.com">hildingshantverk@gmail.com</a>
        <a href="tel:+46701234567">+46 70 123 45 67</a>
      </div>
    </div>
  </footer>

  <div class="product-modal" id="product-modal" role="dialog" aria-modal="true" aria-labelledby="pm-title" aria-hidden="true">
    <div class="product-modal__overlay" data-close></div>
    <div class="product-modal__dialog">
      <button class="product-modal__close" type="button" aria-label="Stäng" data-close>×</button>
      <div class="product-modal__media"><img id="pm-img" src="" alt="" /></div>
      <div class="product-modal__body">
        <p class="eyebrow">Handgjort ljus</p>
        <h2 id="pm-title"></h2>
        <p class="product-modal__price" id="pm-price"></p>
        <p class="product-modal__desc" id="pm-desc"></p>
        <a class="btn" id="pm-order" href="kontakt.html">Beställ eller fråga om denna</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    // Produkterna redigeras i js/data.js
    const grid = document.getElementById("product-grid");
    grid.innerHTML = SITE_DATA.products.map((p, i) => `
      <button type="button" class="card reveal" data-index="${i}" aria-haspopup="dialog">
        <div class="card__media"><img src="${p.img}" alt="${p.name}" loading="lazy"></div>
        <div class="card__body"><h3>${p.name}</h3><span class="card__price">${p.price}</span></div>
      </button>`).join("");

    /* ---- Produkt-popup (fokusläge) ---- */
    (function () {
      const modal = document.getElementById("product-modal");
      const pmImg = document.getElementById("pm-img");
      const pmTitle = document.getElementById("pm-title");
      const pmPrice = document.getElementById("pm-price");
      const pmDesc = document.getElementById("pm-desc");
      const pmOrder = document.getElementById("pm-order");
      let lastFocused = null;

      function openModal(i) {
        const p = SITE_DATA.products[i];
        if (!p) return;
        pmImg.src = p.img;
        pmImg.alt = p.name;
        pmTitle.textContent = p.name;
        pmPrice.textContent = p.price;
        pmDesc.textContent = p.desc || "";
        pmDesc.style.display = p.desc ? "" : "none";
        pmOrder.href = "kontakt.html?bestall=" + encodeURIComponent(p.name);
        lastFocused = document.activeElement;
        modal.classList.add("is-open");
        modal.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        modal.querySelector(".product-modal__close").focus();
      }
      function closeModal() {
        modal.classList.remove("is-open");
        modal.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        if (lastFocused) lastFocused.focus();
      }

      grid.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-index]");
        if (btn) openModal(Number(btn.dataset.index));
      });
      modal.addEventListener("click", (e) => {
        if (e.target.hasAttribute("data-close")) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.classList.contains("is-open")) closeModal();
      });
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
