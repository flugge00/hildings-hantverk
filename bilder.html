<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilder — Hildings Hantverk</title>
  <meta name="description" content="Bilder på handgjorda ljus från Hildings Hantverk." />
  <link rel="icon" href="logos/variations/badge-round-green.svg" type="image/svg+xml" />
  <link rel="icon" href="logos/variations/logo-only.svg" sizes="any" />
  <link rel="apple-touch-icon" href="logos/variations/app-icon-dark.svg" />
  <meta name="theme-color" content="#14100c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand-mark" href="index.html"><span class="brand-mark__logo" aria-hidden="true"></span> Hildings Hantverk</a>
      <button class="nav-toggle" aria-label="Meny" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="nav" id="site-nav">
        <a href="index.html">Hem</a>
        <a href="katalog.html">Katalog</a>
        <a href="bilder.html" aria-current="page">Bilder</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="wrap">
      <p class="eyebrow">Ögonblick i ljus</p>
      <h1>Bilder</h1>
      <p class="lead">Ljus från marknader och verkstad — Ekenäs, Vadstena och däremellan.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="gallery" id="gallery"></div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" aria-label="Stäng">×</button>
    <img src="" alt="" />
  </div>

  <footer class="site-footer">
    <div class="wrap site-footer__inner">
      <p class="muted" style="margin:0">© 2026 Hildings Hantverk</p>
      <div class="footer-contact">
        <a href="mailto:hildingshantverk@gmail.com">hildingshantverk@gmail.com</a>
        <a href="tel:+46701234567">+46 70 123 45 67</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script>
    // Galleribilderna redigeras i js/data.js
    document.getElementById("gallery").innerHTML = SITE_DATA.gallery.map(s => `
      <a href="${s.img}" data-lightbox class="reveal">
        <img src="${s.img}" alt="${s.alt}" loading="lazy">
      </a>`).join("");
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
